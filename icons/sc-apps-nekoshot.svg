<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="NekoShot">
  <title>NekoShot</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343438"/>
      <stop offset="0.55" stop-color="#1B2230"/>
      <stop offset="1" stop-color="#090F1E"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE1EB"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.12" y1="0.08" x2="0.88" y2="0.92">
      <stop offset="0" stop-color="#B69CFF"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#1B2436"/>
      <stop offset="1" stop-color="#0A0F1A"/>
    </radialGradient>
  </defs>

  <!-- Continuous-corner squircle: 22.37% corner radius with softened tangents. -->
  <path fill="url(#body)" d="M 229 0
    L 795 0
    C 937 0 1024 87 1024 229
    L 1024 795
    C 1024 937 937 1024 795 1024
    L 229 1024
    C 87 1024 0 937 0 795
    L 0 229
    C 0 87 87 0 229 0 Z"/>

  <!-- Hairline rim keeps the silhouette crisp on light and dark wallpapers. -->
  <path fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4" d="M 229 0
    L 795 0
    C 937 0 1024 87 1024 229
    L 1024 795
    C 1024 937 937 1024 795 1024
    L 229 1024
    C 87 1024 0 937 0 795
    L 0 229
    C 0 87 87 0 229 0 Z"/>

  <!-- Cat head silhouette: two soft ears merged with a round head. -->
  <path fill="url(#head)" d="M 292 432
    C 276 352 282 280 316 250
    C 328 240 344 242 356 256
    C 388 292 422 352 446 402 Z"/>
  <path fill="url(#head)" d="M 732 432
    C 748 352 742 280 708 250
    C 696 240 680 242 668 256
    C 636 292 602 352 578 402 Z"/>
  <circle cx="512" cy="548" r="252" fill="url(#head)"/>

  <!-- Camera lens: thin violet-to-cyan ring, dark glass and one highlight. -->
  <circle cx="512" cy="548" r="148" fill="url(#glass)"/>
  <circle cx="512" cy="548" r="148" fill="none" stroke="url(#ring)" stroke-width="20"/>
  <circle cx="462" cy="500" r="23" fill="#FFFFFF" opacity="0.92"/>
  <circle cx="556" cy="590" r="9" fill="#22D3EE" opacity="0.55"/>
</svg>
